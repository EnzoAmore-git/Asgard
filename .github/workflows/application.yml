name: Application checks

on:
  push:
    branches: [main]
    paths: ['application/**', 'tools/environment/**', '.github/workflows/application.yml']
  pull_request:
    paths: ['application/**', 'tools/environment/**', '.github/workflows/application.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: asgard_test
      DB_USERNAME: asgard_test
      DB_PASSWORD: ci-only-not-a-real-secret
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only-not-a-real-secret
          MYSQL_DATABASE: asgard_test
          MYSQL_USER: asgard_test
          MYSQL_PASSWORD: ci-only-not-a-real-secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip, sodium, mbstring, dom, curl, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate dependencies
        run: |
          composer validate --strict
          composer audit
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Check and build mobile interface
        run: |
          npm run typecheck
          npm run build
      - name: Test on MySQL, including concurrent operations
        run: php vendor/phpunit/phpunit/phpunit --configuration phpunit.xml
